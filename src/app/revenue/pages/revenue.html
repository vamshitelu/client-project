<main class="page-shell">
  <header class="page-header">
    <h1>Revenue Generating Contract Search</h1>
    <button class="button button-primary add-button" type="button">Add New</button>
  </header>

  <form class="search-form" [formGroup]="searchForm" (ngSubmit)="search()">
    <div class="three-column-fields">
      <label class="field"><span>RGC ID</span><input type="text" formControlName="rgcId" /></label>
      <label class="field"><span>Entity Name</span><input type="text" formControlName="entityName" /></label>
      <label class="field"><span>Federal ID</span><input type="text" formControlName="federalId" /></label>

      <label class="field">
        <span>Agency</span>
        <select formControlName="agency">
          <option value="">Please Select</option>
          @for (agency of agencies; track agency) { <option [value]="agency">{{ agency }}</option> }
        </select>
      </label>
      <label class="field">
        <span>Division</span>
        <select formControlName="division">
          <option value="">Please Select</option>
          @for (division of divisions; track division) { <option [value]="division">{{ division }}</option> }
        </select>
      </label>
      <label class="field">
        <span>Department</span>
        <select formControlName="department">
          <option value="">Please Select</option>
          @for (department of departments; track department) { <option [value]="department">{{ department }}</option> }
        </select>
      </label>
    </div>

    <div class="two-column-fields">
      <label class="field"><span>RGC Status</span><select formControlName="rgcStatus"><option value="">Please Select</option>@for (status of rgcStatuses; track status) { <option [value]="status">{{ status }}</option> }</select></label>
      <label class="field"><span>Revenue Lead</span><select formControlName="revenueLead"><option value="">Please Select</option>@for (lead of revenueLeads; track lead) { <option [value]="lead">{{ lead }}</option> }</select></label>

      <fieldset class="field date-field">
        <legend>Begin Date</legend>
        <div class="date-controls"><select formControlName="beginDateOperator" aria-label="Begin date operator"><option value="After">After</option><option value="Before">Before</option></select><input type="date" formControlName="beginDate" aria-label="Begin date" /></div>
      </fieldset>
      <fieldset class="field date-field">
        <legend>End Date</legend>
        <div class="date-controls"><select formControlName="endDateOperator" aria-label="End date operator"><option value="After">After</option><option value="Before">Before</option></select><input type="date" formControlName="endDate" aria-label="End date" /></div>
      </fieldset>

      <label class="field"><span>Total Revenue</span><select formControlName="totalRevenueOperator"><option value="Equal to">Equal to</option><option value="Greater than">Greater than</option><option value="Less than">Less than</option></select></label>
      <label class="field"><span>Amount</span><input type="text" formControlName="amount" /></label>
    </div>

    <div class="form-actions">
      <label class="checkbox-label"><input type="checkbox" formControlName="startsWith" /><span>Starts With</span></label>
      <button class="button button-primary" type="submit">Search</button>
      <button class="button button-primary" type="button" (click)="reset()">Reset</button>
    </div>
    @if (searchSubmitted()) { <p class="search-status" role="status">Search submitted.</p> }
  </form>
</main>
